<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Job Application </h2>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name">
    <br>
    <br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br>
    <br>

    <label for="Phone">Email:</label>
    <input type="Phone" id="Phone" name="Phone">
    <br>
    <br>
    <label for="Resume">Resume:</label>
    <input type="file" id="Resume" name="file" value="Choose file">
    <br>
    <br>

    <label for="exp">Experience:</label>
    <input type="number" id="exp" name="exp" value="write your exp" min="0" max="50" >
    <br>
    <br>
    <fieldset>
        <legend>Skill</legend>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="checkbox">
        <br>
        <label for="html">Css</label>
        <input type="checkbox" id="Css" name="css">
        <br>
        <label for="javascript">Css</label>
        <input type="checkbox" id="javascript" name="javascript">
        <br>
        <br>
    </fieldset>
    <br>
    <label for="highest">highest Education:</label>
    <select name="select" id="highest">
        <option value="primary">primary</option>
        <option value="primary1">primary1</option>
        <option value="secondary">secondry</option>
    </select>
    <br>
    <br>
    <label for="available">Availability:</label>
    <br>
    <input type="Radio" id="available" value="Full time" name="radio" >
    <label for="available">Full time</label>
    <br>
    <input type="Radio" id="available" value="part time" name="radio" >
    <label for="available">Part time</label>

    <br>
    <br>
  <label for="comments">Additional Comments: </label>
  <br>
  <textarea name="text" id="comments" cols="20" rows="10"></textarea>
  <input type="submit" value="submit applications">
</body>
</html>
